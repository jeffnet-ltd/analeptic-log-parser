name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - master

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub is the source of truth going forward: this force-pushes master onto
      # the Space's main branch so the two never silently drift apart again.
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://JeffNet:${HF_TOKEN}@huggingface.co/spaces/JeffNet/analeptic-log-parser master:main
